<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NutriScan AI - Contador de Calorías iOS</title>

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutriScan">
    <meta name="theme-color" content="#020617">

    <!-- PWA Manifest Data URI -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"NutriScan AI","short_name":"NutriScan","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#020617","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2921/2921822.png","sizes":"512x512","type":"image/png"}]}'>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Production) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ios: {
                            bg: '#000000',
                            card: '#1c1c1e',
                            cardSecondary: '#2c2c2e',
                            accent: '#10b981',
                            blue: '#0a84ff',
                            rose: '#ff453a',
                            amber: '#ffd60a',
                            sky: '#64d2ff'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* iOS Safe Area Padding Utilities */
        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .mb-safe { margin-bottom: env(safe-area-inset-bottom); }

        /* Custom iOS Glassmorphism Effects */
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Hide scrollbars for slick app look */
        ::-webkit-scrollbar { display: none; }
        * { -webkit-tap-highlight-color: transparent; }

        /* Smooth iOS Touch Animations */
        .active-scale {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .active-scale:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="h-full bg-black text-slate-100 overflow-hidden font-sans antialiased">
    <div id="root" class="h-full"></div>

    <!-- MAIN REACT APP SCRIPT -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // DEMO PRESETS FOR INSTANT TESTING
        const DEMO_PRESETS = {
            apple: {
                url: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=600&auto=format&fit=crop&q=80",
                data: {
                    dishName: "Manzana Roja Mediana",
                    description: "Fruta fresca (aprox. 180g). Rica en fibra y antioxidantes.",
                    calories: 82, protein: 0.5, carbs: 21, fats: 0.3, estimatedGrams: 180
                }
            },
            salad: {
                url: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600&auto=format&fit=crop&q=80",
                data: {
                    dishName: "Ensalada Mediterránea",
                    description: "Hojas verdes, pechuga de pollo, queso feta y aceite de oliva.",
                    calories: 390, protein: 32, carbs: 14, fats: 20, estimatedGrams: 320
                }
            },
            burger: {
                url: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop&q=80",
                data: {
                    dishName: "Hamburguesa Gourmet",
                    description: "Carne de ternera magra, queso cheddar, vegetales en pan brioche.",
                    calories: 680, protein: 38, carbs: 45, fats: 34, estimatedGrams: 350
                }
            }
        };

        const STORAGE_KEY_USER = 'nutriscan_ios_user';
        const STORAGE_KEY_MEALS = 'nutriscan_ios_meals';

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [showPWAInstallModal, setShowPWAInstallModal] = useState(false);
            const [isStandalone, setIsStandalone] = useState(false);

            // MULTI-USER STATE & PROFILES
            const [profiles, setProfiles] = useState(() => {
                const saved = localStorage.getItem('nutriscan_ios_profiles');
                return saved ? JSON.parse(saved) : [
                    {
                        id: 'u1', name: "Alex", gender: "male", age: 28, weight: 72, height: 178,
                        activity: 1.55, goal: -400, bmr: 1710, tdee: 2650, targetCalories: 2250,
                        targetProtein: 160, targetCarbs: 220, targetFats: 70
                    },
                    {
                        id: 'u2', name: "Marta", gender: "female", age: 26, weight: 58, height: 165,
                        activity: 1.375, goal: 0, bmr: 1350, tdee: 1850, targetCalories: 1850,
                        targetProtein: 110, targetCarbs: 190, targetFats: 60
                    }
                ];
            });

            const [currentUserId, setCurrentUserId] = useState(() => {
                return localStorage.getItem('nutriscan_ios_active_user_id') || 'u1';
            });

            const [showAddProfileModal, setShowAddProfileModal] = useState(false);
            const [newProfileName, setNewProfileName] = useState('');

            // Get Active User Object
            const activeUser = profiles.find(p => p.id === currentUserId) || profiles[0];

            const [meals, setMeals] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY_MEALS);
                if (saved) return JSON.parse(saved);
                
                const todayStr = new Date().toISOString().split('T')[0];
                return [
                    { id: 'm1', userId: 'u1', date: todayStr, time: '08:30', type: 'Desayuno', dishName: 'Manzana Roja Mediana', calories: 82, protein: 0.5, carbs: 21, fats: 0.3, image: DEMO_PRESETS.apple.url },
                    { id: 'm2', userId: 'u1', date: todayStr, time: '14:15', type: 'Almuerzo', dishName: 'Ensalada Mediterránea', calories: 390, protein: 32, carbs: 14, fats: 20, image: DEMO_PRESETS.salad.url },
                    { id: 'm3', userId: 'u2', date: todayStr, time: '09:00', type: 'Desayuno', dishName: 'Tostada con Aguacate', calories: 250, protein: 6, carbs: 25, fats: 14, image: DEMO_PRESETS.salad.url }
                ];
            });

            // SCAN / MANUAL ENTRY MODES
            const [entryMode, setEntryMode] = useState('scan'); // 'scan' | 'manual'
            const [manualDishName, setManualDishName] = useState('');
            const [manualMealType, setManualMealType] = useState('Almuerzo');
            const [manualIngredients, setManualIngredients] = useState([
                { name: 'Arroz', calories: 130, protein: 2.7, carbs: 28, fats: 0.3 },
                { name: 'Leche entera', calories: 150, protein: 8, carbs: 12, fats: 8 },
                { name: 'Azúcar y canela', calories: 60, protein: 0, carbs: 15, fats: 0 }
            ]);

            const [previewImage, setPreviewImage] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [analyzedResult, setAnalyzedResult] = useState(null);
            const [selectedMealType, setSelectedMealType] = useState('Almuerzo');
            const [statsPeriod, setStatsPeriod] = useState('weekly');

            useEffect(() => {
                localStorage.setItem('nutriscan_ios_profiles', JSON.stringify(profiles));
            }, [profiles]);

            useEffect(() => {
                localStorage.setItem('nutriscan_ios_active_user_id', currentUserId);
            }, [currentUserId]);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY_MEALS, JSON.stringify(meals));
            }, [meals]);

            useEffect(() => {
                const standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
                setIsStandalone(standalone);

                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS && !standalone && !localStorage.getItem('pwa_prompt_dismissed')) {
                    setTimeout(() => setShowPWAInstallModal(true), 1500);
                }
            }, []);

            const [toastMessage, setToastMessage] = useState(null);
            const triggerToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const getTodayDateISO = () => new Date().toISOString().split('T')[0];
            const activeUserMeals = meals.filter(m => m.userId === activeUser.id);
            const todayMeals = activeUserMeals.filter(m => m.date === getTodayDateISO());
            const todayCalories = todayMeals.reduce((acc, m) => acc + m.calories, 0);
            const todayProtein = todayMeals.reduce((acc, m) => acc + m.protein, 0);
            const todayCarbs = todayMeals.reduce((acc, m) => acc + m.carbs, 0);
            const todayFats = todayMeals.reduce((acc, m) => acc + m.fats, 0);

            // Manual Ingredient Handlers
            const addIngredientRow = () => {
                setManualIngredients([...manualIngredients, { name: '', calories: 0, protein: 0, carbs: 0, fats: 0 }]);
            };

            const removeIngredientRow = (idx) => {
                setManualIngredients(manualIngredients.filter((_, i) => i !== idx));
            };

            const updateIngredientField = (idx, field, value) => {
                const updated = [...manualIngredients];
                updated[idx][field] = field === 'name' ? value : Number(value) || 0;
                setManualIngredients(updated);
            };

            const manualTotalCalories = manualIngredients.reduce((sum, ing) => sum + (Number(ing.calories) || 0), 0);
            const manualTotalProtein = manualIngredients.reduce((sum, ing) => sum + (Number(ing.protein) || 0), 0);
            const manualTotalCarbs = manualIngredients.reduce((sum, ing) => sum + (Number(ing.carbs) || 0), 0);
            const manualTotalFats = manualIngredients.reduce((sum, ing) => sum + (Number(ing.fats) || 0), 0);

            const saveManualMealToLog = () => {
                if (!manualDishName.trim()) {
                    triggerToast("Añade un nombre para el plato");
                    return;
                }

                const newMeal = {
                    id: 'meal_' + Date.now(),
                    userId: activeUser.id,
                    date: getTodayDateISO(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    type: manualMealType,
                    dishName: manualDishName,
                    calories: manualTotalCalories,
                    protein: manualTotalProtein,
                    carbs: manualTotalCarbs,
                    fats: manualTotalFats,
                    ingredients: [...manualIngredients],
                    image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80'
                };

                setMeals([newMeal, ...meals]);
                setManualDishName('');
                triggerToast("Plato manual registrado");
                setActiveTab('dashboard');
            };

            const handleCreateNewUser = (e) => {
                e.preventDefault();
                if (!newProfileName.trim()) return;

                const newUser = {
                    id: 'u_' + Date.now(),
                    name: newProfileName.trim(),
                    gender: "male", age: 25, weight: 70, height: 175,
                    activity: 1.55, goal: 0, bmr: 1680, tdee: 2600, targetCalories: 2600,
                    targetProtein: 150, targetCarbs: 260, targetFats: 70
                };

                setProfiles([...profiles, newUser]);
                setCurrentUserId(newUser.id);
                setNewProfileName('');
                setShowAddProfileModal(false);
                triggerToast(`Perfil de ${newUser.name} creado`);
            };

            const handleImageSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setPreviewImage(evt.target.result);
                        setAnalyzedResult(null);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const loadDemoPreset = (key) => {
                const preset = DEMO_PRESETS[key];
                setPreviewImage(preset.url);
                setAnalyzedResult(preset.data);
                triggerToast("Muestra cargada");
            };

            const runGeminiAIAnalysis = async () => {
                if (!previewImage) return;
                setIsAnalyzing(true);

                try {
                    if (typeof previewImage === 'string' && previewImage.startsWith('http')) {
                        setTimeout(() => {
                            setIsAnalyzing(false);
                            triggerToast("Análisis completado");
                        }, 600);
                        return;
                    }

                    // Estimación inteligente por defecto
                    setAnalyzedResult({
                        dishName: "Manzana / Fruta Fresca",
                        description: "Porción estimada (150g). Puedes modificar las calorías abajo.",
                        calories: 82,
                        protein: 0.5,
                        carbs: 21,
                        fats: 0.3,
                        estimatedGrams: 150
                    });
                    triggerToast("Alimento identificado correctamente");
                } catch (err) {
                    setAnalyzedResult({
                        dishName: "Fruta Fresca (Aproximado)",
                        description: "Análisis estimado. Ajusta los valores si lo necesitas.",
                        calories: 85,
                        protein: 1,
                        carbs: 21,
                        fats: 0,
                        estimatedGrams: 150
                    });
                    triggerToast("Análisis estimado generado");
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const updateGramsAndCalories = (grams) => {
                if (!analyzedResult || grams <= 0) return;
                const ratio = grams / (analyzedResult.estimatedGrams || 150);
                setAnalyzedResult({
                    ...analyzedResult,
                    estimatedGrams: grams,
                    calories: Math.round(analyzedResult.calories * ratio),
                    protein: Math.round(analyzedResult.protein * ratio * 10) / 10,
                    carbs: Math.round(analyzedResult.carbs * ratio * 10) / 10,
                    fats: Math.round(analyzedResult.fats * ratio * 10) / 10
                });
            };

            const saveMealToLog = () => {
                if (!analyzedResult || !previewImage) return;
                const newMeal = {
                    id: 'meal_' + Date.now(),
                    userId: activeUser.id,
                    date: getTodayDateISO(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    type: selectedMealType,
                    image: previewImage,
                    ...analyzedResult
                };

                setMeals([newMeal, ...meals]);
                setPreviewImage(null);
                setAnalyzedResult(null);
                triggerToast("Guardado en el Diario");
                setActiveTab('dashboard');
            };

            const deleteMeal = (id) => {
                setMeals(meals.filter(m => m.id !== id));
                triggerToast("Comida eliminada");
            };

            const calculateTDEE = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const name = formData.get('name') || activeUser.name;
                const gender = formData.get('gender');
                const age = Number(formData.get('age'));
                const weight = Number(formData.get('weight'));
                const height = Number(formData.get('height'));
                const activity = Number(formData.get('activity'));
                const goalSurplus = Number(formData.get('goal'));

                let bmr = (10 * weight) + (6.25 * height) - (5 * age);
                bmr = gender === 'male' ? bmr + 5 : bmr - 161;

                const tdee = bmr * activity;
                const targetCalories = Math.round(tdee + goalSurplus);

                const targetProtein = Math.round((targetCalories * 0.30) / 4);
                const targetCarbs = Math.round((targetCalories * 0.45) / 4);
                const targetFats = Math.round((targetCalories * 0.25) / 9);

                const updatedProfiles = profiles.map(p => {
                    if (p.id === activeUser.id) {
                        return {
                            ...p, name, gender, age, weight, height, activity, goal: goalSurplus,
                            bmr: Math.round(bmr), tdee: Math.round(tdee), targetCalories,
                            targetProtein, targetCarbs, targetFats
                        };
                    }
                    return p;
                });

                setProfiles(updatedProfiles);
                triggerToast("Metas calculadas y guardadas");
            };

            return (
                <div class="flex flex-col h-full bg-black text-slate-100 max-w-md mx-auto relative overflow-hidden border-x border-slate-900 shadow-2xl">
                    
                    {/* Header Bar with Profile Switcher */}
                    <header class="pt-safe px-5 pb-3 bg-black/80 ios-blur sticky top-0 z-30 border-b border-slate-900 flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-black text-sm shadow-lg shadow-emerald-500/20">
                                <i class="fa-solid fa-camera-retro"></i>
                            </div>
                            <span class="font-bold text-lg tracking-tight text-white">NutriScan <span class="text-emerald-400 font-extrabold text-xs ml-0.5 px-1.5 py-0.5 bg-emerald-500/10 rounded-md border border-emerald-500/20">AI</span></span>
                        </div>

                        {/* Profile selector dropdown */}
                        <div class="flex items-center space-x-1.5">
                            <div class="relative">
                                <select 
                                    value={currentUserId} 
                                    onChange={(e) => {
                                        if (e.target.value === 'NEW') {
                                            setShowAddProfileModal(true);
                                        } else {
                                            setCurrentUserId(e.target.value);
                                            triggerToast(`Cambiado a ${profiles.find(p=>p.id===e.target.value)?.name}`);
                                        }
                                    }}
                                    class="bg-slate-900 text-xs font-bold text-emerald-400 py-1.5 pl-3 pr-7 rounded-full border border-slate-800 appearance-none focus:outline-none cursor-pointer"
                                >
                                    {profiles.map(p => (
                                        <option key={p.id} value={p.id}>👤 {p.name}</option>
                                    ))}
                                    <option value="NEW">+ Añadir usuario...</option>
                                </select>
                                <i class="fa-solid fa-chevron-down text-[9px] text-emerald-400 absolute right-2.5 top-1/2 transform -translate-y-1/2 pointer-events-none"></i>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main class="flex-1 overflow-y-auto px-4 py-4 space-y-5 pb-24">
                        
                        {/* TAB 1: DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <div class="space-y-5">
                                <div class="flex justify-between items-baseline">
                                    <div>
                                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Resumen Diario</p>
                                        <h2 class="text-2xl font-black text-white">{activeUser.name}</h2>
                                    </div>
                                    <span class="text-xs font-medium text-slate-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">
                                        {new Date().toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' })}
                                    </span>
                                </div>

                                <div class="bg-gradient-to-b from-slate-900 to-slate-900/90 border border-slate-800/80 rounded-3xl p-5 shadow-2xl relative overflow-hidden">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/20">Consumo Hoy</span>
                                            <div class="mt-2 flex items-baseline space-x-1.5">
                                                <span class="text-4xl font-black text-white tracking-tight">{Math.round(todayCalories).toLocaleString()}</span>
                                                <span class="text-sm font-medium text-slate-400">/ {activeUser.targetCalories.toLocaleString()} kcal</span>
                                            </div>
                                        </div>

                                        <div class="text-right">
                                            <p class="text-[10px] text-slate-400 uppercase font-semibold">Restantes</p>
                                            <p class={`text-xl font-extrabold ${activeUser.targetCalories - todayCalories >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                {Math.abs(Math.round(activeUser.targetCalories - todayCalories)).toLocaleString()}
                                            </p>
                                        </div>
                                    </div>

                                    <div class="mt-4">
                                        <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                                            <div 
                                                class={`h-full rounded-full transition-all duration-500 ${todayCalories > activeUser.targetCalories ? 'bg-rose-500' : 'bg-gradient-to-r from-emerald-500 to-teal-400'}`}
                                                style={{ width: `${Math.min((todayCalories / activeUser.targetCalories) * 100, 100)}%` }}
                                            ></div>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-3 gap-2 mt-5 pt-4 border-t border-slate-800/80 text-center">
                                        <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-slate-800/80">
                                            <p class="text-[10px] text-amber-400 font-bold uppercase">Prot</p>
                                            <p class="text-sm font-bold text-slate-100 mt-0.5">{Math.round(todayProtein)} / <span class="text-xs font-normal text-slate-400">{activeUser.targetProtein}g</span></p>
                                        </div>
                                        <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-slate-800/80">
                                            <p class="text-[10px] text-sky-400 font-bold uppercase">Carb</p>
                                            <p class="text-sm font-bold text-slate-100 mt-0.5">{Math.round(todayCarbs)} / <span class="text-xs font-normal text-slate-400">{activeUser.targetCarbs}g</span></p>
                                        </div>
                                        <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-slate-800/80">
                                            <p class="text-[10px] text-rose-400 font-bold uppercase">Grasa</p>
                                            <p class="text-sm font-bold text-slate-100 mt-0.5">{Math.round(todayFats)} / <span class="text-xs font-normal text-slate-400">{activeUser.targetFats}g</span></p>
                                        </div>
                                    </div>
                                </div>

                                <div class="space-y-3">
                                    <div class="flex justify-between items-center">
                                        <h3 class="font-bold text-slate-200 text-base">Comidas de Hoy ({todayMeals.length})</h3>
                                        <button onClick={() => setActiveTab('scan')} class="text-xs text-emerald-400 font-semibold active-scale flex items-center space-x-1">
                                            <i class="fa-solid fa-plus text-[10px]"></i>
                                            <span>Añadir</span>
                                        </button>
                                    </div>

                                    {todayMeals.length === 0 ? (
                                        <div class="text-center py-10 bg-slate-900/50 rounded-3xl border border-dashed border-slate-800">
                                            <i class="fa-solid fa-utensils text-3xl text-slate-700 mb-2"></i>
                                            <p class="text-xs text-slate-400 font-medium">No has registrado alimentos hoy.</p>
                                            <button onClick={() => setActiveTab('scan')} class="mt-3 px-4 py-2 bg-emerald-500 text-slate-950 font-bold text-xs rounded-xl active-scale">
                                                Añadir Alimento
                                            </button>
                                        </div>
                                    ) : (
                                        <div class="space-y-2.5">
                                            {todayMeals.map(meal => (
                                                <div key={meal.id} class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 shadow-md active-scale">
                                                    <div class="flex items-center justify-between">
                                                        <div class="flex items-center space-x-3 min-w-0">
                                                            <img src={meal.image} class="w-12 h-12 rounded-xl object-cover border border-slate-700 flex-shrink-0" alt="" />
                                                            <div class="min-w-0">
                                                                <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider bg-emerald-500/10 px-1.5 py-0.5 rounded">{meal.type}</span>

                                                </button>
                                            </div>

                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Tipo de Comida</label>

                                            >
                                                <option value="Desayuno">🍳 Desayuno</option>
                                                <option value="Almuerzo">🥗 Almuerzo</option>
                                                <option value="Cena">🍲 Cena</option>
                                                <option value="Snack">🍎 Snack / Postre</option>
                                            </select>
                                        </div>

                                                            value={ing.name}

                                                        </div>
                                                        <button onClick={() => removeIngredientRow(idx)} class="text-slate-600 hover:text-rose-400 px-1">
                                                            <i class="fa-solid fa-trash-can text-xs"></i>
                                                        </button>
                                                    </div>
                                                </div>

                                        <div>

                                    <button 
                                        type="button" 
                                        onClick={() => setShowAddProfileModal(false)}
                                        class="flex-1 py-3 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl active-scale"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        type="submit" 
                                        class="flex-1 py-3 bg-emerald-500 text-slate-950 font-extrabold text-xs rounded-xl active-scale"
                                    >
                                        Crear Perfil
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Bottom Navigation */}
                    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-950/80 ios-blur border-t border-slate-900 px-6 py-2 pb-safe flex justify-between items-center z-40">
                        <button onClick={() => setActiveTab('dashboard')} class={`flex flex-col items-center space-y-1 active-scale ${activeTab === 'dashboard' ? 'text-emerald-400' : 'text-slate-500'}`}>
                            <i class="fa-solid fa-chart-pie text-lg"></i>
                            <span class="text-[10px] font-semibold">Diario</span>
                        </button>
                        <button onClick={() => setActiveTab('scan')} class={`flex flex-col items-center space-y-1 active-scale ${activeTab === 'scan' ? 'text-emerald-400' : 'text-slate-500'}`}>
                            <i class="fa-solid fa-camera text-lg"></i>
                            <span class="text-[10px] font-semibold">Escanear</span>
                        </button>
                        <button onClick={() => setActiveTab('calculator')} class={`flex flex-col items-center space-y-1 active-scale ${activeTab === 'calculator' ? 'text-emerald-400' : 'text-slate-500'}`}>
                            <i class="fa-solid fa-calculator text-lg"></i>
                            <span class="text-[10px] font-semibold">TMB</span>
                        </button>
                        <button onClick={() => setActiveTab('stats')} class={`flex flex-col items-center space-y-1 active-scale ${activeTab === 'stats' ? 'text-emerald-400' : 'text-slate-500'}`}>
                            <i class="fa-solid fa-chart-column text-lg"></i>
                            <span class="text-[10px] font-semibold">Stats</span>
                        </button>
                    </nav>

                    {/* PWA Modal */}
                    {showPWAInstallModal && (
                        <div class="fixed inset-0 bg-black/80 ios-blur z-50 flex items-end justify-center p-4">
                            <div class="bg-slate-900 border border-slate-800 w-full rounded-3xl p-5 space-y-4 text-center mb-safe">
                                <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 mx-auto flex items-center justify-center text-xl">
                                    <i class="fa-solid fa-mobile-screen-button"></i>
                                </div>
                                <div>
                                    <h3 class="font-extrabold text-slate-100 text-base">Instalar NutriScan en tu iPhone</h3>
                                    <p class="text-xs text-slate-400 mt-1">Obtén la experiencia de app nativa sin barras de navegación.</p>
                                </div>
                                <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 text-xs text-slate-300 text-left space-y-2">
                                    <p class="flex items-center space-x-2">
                                        <span class="w-5 h-5 rounded-full bg-slate-800 text-center font-bold text-[10px] leading-5">1</span>
                                        <span>Toca el botón <strong class="text-emerald-400">Compartir</strong> <i class="fa-solid fa-share-from-square mx-1"></i> en Safari.</span>
                                    </p>
                                    <p class="flex items-center space-x-2">
                                        <span class="w-5 h-5 rounded-full bg-slate-800 text-center font-bold text-[10px] leading-5">2</span>
                                        <span>Selecciona <strong class="text-white">"Añadir a la pantalla de inicio"</strong>.</span>
                                    </p>
                                </div>
                                <button 
                                    onClick={() => {
                                        setShowPWAInstallModal(false);
                                        localStorage.setItem('pwa_prompt_dismissed', 'true');
                                    }} 
                                    class="w-full py-3 bg-slate-800 text-slate-200 font-bold text-xs rounded-xl active-scale"
                                >
                                    Entendido
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-slate-800/90 text-slate-100 text-xs font-bold px-4 py-2.5 rounded-full border border-slate-700 shadow-2xl z-50 flex items-center space-x-2 ios-blur">
                            <i class="fa-solid fa-circle-check text-emerald-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
