<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutriScan AI - Tu Nutricionista Inteligente</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .active-scale:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="h-full overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Base de datos nutricional completa (por 100g)
        const NUTRITION_DB = [
            // Pasta con salsas y variedades
            { keywords: ['macarron', 'macarrones', 'penne'], name: 'Macarrones (cocidos)', caloriesPer100g: 158, p100: 5.8, c100: 31, f100: 0.9 },
            { keywords: ['macarrones con boloñesa', 'boloñesa'], name: 'Macarrones con Boloñesa', caloriesPer100g: 195, p100: 9.5, c100: 22, f100: 7.5 },
            { keywords: ['espagueti', 'espaguetis', 'spaghetti'], name: 'Espaguetis (cocidos)', caloriesPer100g: 158, p100: 5.8, c100: 31, f100: 0.9 },
            { keywords: ['espaguetis con carbonara', 'carbonara'], name: 'Espaguetis con Carbonara', caloriesPer100g: 225, p100: 8.5, c100: 24, f100: 11 },
            { keywords: ['ravioli', 'raviolis'], name: 'Raviolis', caloriesPer100g: 175, p100: 7, c100: 28, f100: 4 },
            { keywords: ['raviolis al pesto', 'pesto'], name: 'Raviolis al Pesto', caloriesPer100g: 240, p100: 6.5, c100: 26, f100: 12.5 },
            { keywords: ['fideo', 'fideos'], name: 'Fideos de Sopa', caloriesPer100g: 138, p100: 4.5, c100: 25, f100: 1.2 },
            { keywords: ['lasana', 'lasaña'], name: 'Lasaña', caloriesPer100g: 135, p100: 7.5, c100: 15, f100: 5 },
            // Arroces y Paellas
            { keywords: ['arroz blanco', 'arroz'], name: 'Arroz Blanco (cocido)', caloriesPer100g: 130, p100: 2.7, c100: 28, f100: 0.3 },
            { keywords: ['arroz integral'], name: 'Arroz Integral (cocido)', caloriesPer100g: 111, p100: 2.6, c100: 23, f100: 0.9 },
            { keywords: ['paella valenciana', 'paella'], name: 'Paella Valenciana', caloriesPer100g: 165, p100: 8.2, c100: 21, f100: 5.5 },
            { keywords: ['paella de marisco', 'arroz de marisco'], name: 'Paella de Marisco', caloriesPer100g: 150, p100: 9.0, c100: 19, f100: 4.2 },
            { keywords: ['arroz al horno'], name: 'Arroz al Horno', caloriesPer100g: 190, p100: 9.5, c100: 20, f100: 8.0 },
            // Legumbres
            { keywords: ['lenteja', 'lentejas'], name: 'Lentejas cocidas', caloriesPer100g: 116, p100: 9.0, c100: 20, f100: 0.4 },
            { keywords: ['garbanzo', 'garbanzos'], name: 'Garbanzos cocidos', caloriesPer100g: 164, p100: 8.9, c100: 27, f100: 2.6 },
            { keywords: ['alubia', 'alubias', 'judias blancas'], name: 'Alubias cocidas', caloriesPer100g: 127, p100: 8.7, c100: 22, f100: 0.5 },
            { keywords: ['edamame'], name: 'Edamame', caloriesPer100g: 121, p100: 11.9, c100: 8.9, f100: 5.2 },
            { keywords: ['guisante', 'guisantes'], name: 'Guisantes', caloriesPer100g: 81, p100: 5.4, c100: 14, f100: 0.4 },
            // Platos Combinados
            { keywords: ['merluza con huevo y brocoli', 'merluza'], name: 'Merluza con Huevo y Brócoli', caloriesPer100g: 95, p100: 12.5, c100: 3.5, f100: 3.2 },
            { keywords: ['pollo con arroz y verduras', 'pollo'], name: 'Pollo con Arroz y Verduras', caloriesPer100g: 142, p100: 13.0, c100: 16, f100: 3.0 },
            { keywords: ['emperador'], name: 'Pez Emperador a la Plancha', caloriesPer100g: 145, p100: 21.0, c100: 0.0, f100: 6.5 },
            // Hortalizas y Verduras
            { keywords: ['zanahoria', 'zanahorias'], name: 'Zanahoria', caloriesPer100g: 41, p100: 0.9, c100: 9.6, f100: 0.2 },
            { keywords: ['brocoli', 'brócoli'], name: 'Brócoli', caloriesPer100g: 34, p100: 2.8, c100: 6.6, f100: 0.4 },
            { keywords: ['espinaca', 'espinacas'], name: 'Espinacas', caloriesPer100g: 23, p100: 2.9, c100: 3.6, f100: 0.4 },
            { keywords: ['calabacin', 'calabacín'], name: 'Calabacín', caloriesPer100g: 17, p100: 1.2, c100: 3.1, f100: 0.3 },
            { keywords: ['aguacate'], name: 'Aguacate', caloriesPer100g: 160, p100: 2.0, c100: 8.5, f100: 14.7 },
            { keywords: ['patata', 'patatas'], name: 'Patata cocida/horno', caloriesPer100g: 87, p100: 1.9, c100: 20, f100: 0.1 },
            { keywords: ['champiñon', 'champiñones', 'setas'], name: 'Champiñones', caloriesPer100g: 22, p100: 3.1, c100: 3.3, f100: 0.3 },
            // Proteínas y Extras
            { keywords: ['jamon', 'jamón', 'jamon serrano'], name: 'Jamón Serrano', caloriesPer100g: 240, p100: 30, c100: 0.5, f100: 13 },
            { keywords: ['pan', 'bocadillo'], name: 'Pan Blanco / Bocadillo', caloriesPer100g: 265, p100: 9, c100: 49, f100: 3.2 },
            { keywords: ['huevo'], name: 'Huevo cocido', caloriesPer100g: 155, p100: 13, c100: 1.1, f100: 11 },
            { keywords: ['aceite de oliva', 'aceite'], name: 'Aceite de Oliva', caloriesPer100g: 884, p100: 0, c100: 0, f100: 100 },
            { keywords: ['queso'], name: 'Queso curado', caloriesPer100g: 402, p100: 25, c100: 1.3, f100: 33 },
            { keywords: ['bacon', 'beicon'], name: 'Beicon', caloriesPer100g: 541, p100: 37, c100: 1.4, f100: 42 }
        ];

        function App() {
            // Estado de usuarios y perfil activo
            const [users, setUsers] = useState([
                { id: '1', name: 'Rubén', goalKcal: 2561, targetP: 192, targetC: 288, targetF: 71, age: 30, weight: 78, height: 175, gender: 'male', activity: 'moderate', goal: 'maintain' },
                { id: '2', name: 'Marta', goalKcal: 2000, targetP: 140, targetC: 220, targetF: 65, age: 28, weight: 62, height: 165, gender: 'female', activity: 'light', goal: 'lose' }
            ]);
            const [activeUserId, setActiveUserId] = useState('1');
            const [showUserManager, setShowUserManager] = useState(false);
            const [newUserName, setNewUserName] = useState('');

            const activeUser = users.find(u => u.id === activeUserId) || users[0];

            // Pestaña activa ('diario', 'escaner', 'manual', 'ai', 'tmb', 'stats')
            const [activeTab, setActiveTab] = useState('diario');

            // Comidas registradas
            const [meals, setMeals] = useState([
                { id: 'm1', userId: '1', mealType: 'Almuerzo', name: 'Macarrones con Boloñesa', calories: 480, p: 22, c: 55, f: 18, time: '13:30', date: new Date().toDateString() }
            ]);

            // Agua (ml)
            const [waterDrank, setWaterDrank] = useState(1250);

            // Registro Manual
            const [manualName, setManualName] = useState('');
            const [manualMealType, setManualMealType] = useState('Almuerzo');
            const [manualGrams, setManualGrams] = useState(250);
            const [manualCal, setManualCal] = useState(400);

            // Escaneo foto simulado / real
            const [selectedImage, setSelectedImage] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [scannedResult, setScannedResult] = useState(null);
            const [scanGrams, setScanGrams] = useState(200);

            // Edición de comida registrada
            const [editingMeal, setEditingMeal] = useState(null);

            // Chat AI
            const [aiMessages, setAiMessages] = useState([
                { role: 'assistant', text: '¡Hola! Soy Monika, tu nutricionista virtual con IA. ¿En qué te puedo ayudar hoy? Puedo proponerte recetas con lo que tengas en casa o darte consejos para cumplir tus metas.' }
            ]);
            const [aiInput, setAiInput] = useState('');
            const [aiLoading, setAiLoading] = useState(false);

            // Filtrar comidas del usuario actual para hoy
            const todayStr = new Date().toDateString();
            const userMeals = meals.filter(m => m.userId === activeUser.id && m.date === todayStr);

            const totalKcal = userMeals.reduce((acc, m) => acc + m.calories, 0);
            const totalP = userMeals.reduce((acc, m) => acc + m.p, 0);
            const totalC = userMeals.reduce((acc, m) => acc + m.c, 0);
            const totalF = userMeals.reduce((acc, m) => acc + m.f, 0);

            // Cálculo automático por texto manual
            const handleManualNameChange = (e) => {
                const val = e.target.value;
                setManualName(val);
                const query = val.toLowerCase();
                let found = NUTRITION_DB.find(item => item.keywords.some(k => query.includes(k)));
                if (found) {
                    const calculated = Math.round((found.caloriesPer100g * manualGrams) / 100);
                    setManualCal(calculated);
                }
            };

            const handleManualGramsChange = (e) => {
                const g = Number(e.target.value) || 0;
                setManualGrams(g);
                const query = manualName.toLowerCase();
                let found = NUTRITION_DB.find(item => item.keywords.some(k => query.includes(k)));
                if (found) {
                    setManualCal(Math.round((found.caloriesPer100g * g) / 100));
                }
            };

            const saveManualMeal = () => {
                if (!manualName.trim()) return;
                const query = manualName.toLowerCase();
                let found = NUTRITION_DB.find(item => item.keywords.some(k => query.includes(k)));
                let p = found ? Math.round((found.p100 * manualGrams) / 100) : 15;
                let c = found ? Math.round((found.c100 * manualGrams) / 100) : 35;
                let f = found ? Math.round((found.f100 * manualGrams) / 100) : 10;

                const newMeal = {
                    id: Date.now().toString(),
                    userId: activeUser.id,
                    mealType: manualMealType,
                    name: manualName,
                    calories: manualCal,
                    p, c, f,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    date: todayStr
                };
                setMeals([newMeal, ...meals]);
                setManualName('');
                setActiveTab('diario');
            };

            // Escaneo foto
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    setSelectedImage(uploadEvent.target.result);
                    processScan(uploadEvent.target.result);
                };
                reader.readAsDataURL(file);
            };

            const processScan = (imgSrc) => {
                setIsAnalyzing(true);
                setTimeout(() => {
                    setIsAnalyzing(false);
                    setScannedResult({
                        name: 'Merluza con Huevo y Brócoli',
                        baseCal100: 95,
                        p100: 12.5,
                        c100: 3.5,
                        f100: 3.2
                    });
                }, 1500);
            };

            const handleQuickPreset = (presetName) => {
                setSelectedImage('https://placehold.co/600x400/1e293b/34d399?text=' + encodeURIComponent(presetName));
                processScan(null);
                if (presetName === 'Macarrones Boloñesa') {
                    setScannedResult({ name: 'Macarrones con Boloñesa', baseCal100: 195, p100: 9.5, c100: 22, f100: 7.5 });
                } else if (presetName === 'Paella') {
                    setScannedResult({ name: 'Paella Valenciana', baseCal100: 165, p100: 8.2, c100: 21, f100: 5.5 });
                } else {
                    setScannedResult({ name: presetName, baseCal100: 140, p100: 10, c100: 15, f100: 5 });
                }
            };

            const saveScannedMeal = () => {
                if (!scannedResult) return;
                const ratio = scanGrams / 100;
                const newMeal = {
                    id: Date.now().toString(),
                    userId: activeUser.id,
                    mealType: 'Almuerzo',
                    name: scannedResult.name,
                    calories: Math.round(scannedResult.baseCal100 * ratio),
                    p: Math.round(scannedResult.p100 * ratio),
                    c: Math.round(scannedResult.c100 * ratio),
                    f: Math.round(scannedResult.f100 * ratio),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    date: todayStr
                };
                setMeals([newMeal, ...meals]);
                setSelectedImage(null);
                setScannedResult(null);
                setActiveTab('diario');
            };

            // Edición comida registrada
            const handleSaveEditedMeal = () => {
                if (!editingMeal) return;
                setMeals(meals.map(m => m.id === editingMeal.id ? editingMeal : m));
                setEditingMeal(null);
            };

            // AI chat query
            const sendAiMessage = async () => {
                if (!aiInput.trim()) return;
                const userText = aiInput;
                setAiInput('');
                const newMsgs = [...aiMessages, { role: 'user', text: userText }];
                setAiMessages(newMsgs);
                setAiLoading(true);

                setTimeout(() => {
                    setAiLoading(false);
                    let reply = `He analizado tu consulta. Llevas ${totalKcal} kcal consumidas de tus ${activeUser.goalKcal} kcal objetivo. `;
                    if (userText.toLowerCase().includes('receta') || userText.toLowerCase().includes('tengo')) {
                        reply += `💡 Te sugiero preparar una menestra ligera de verduras con pechuga de pollo a la plancha (aprox. 380 kcal).`;
                    } else {
                        reply += `Te recomiendo mantenerte hidratado y priorizar proteínas en tu próxima comida para no rebasar los límites.`;
                    }
                    setAiMessages([...newMsgs, { role: 'assistant', text: reply }]);
                }, 1000);
            };

            // Gestión usuarios
            const handleAddUser = () => {
                if (!newUserName.trim()) return;
                const newUser = {
                    id: Date.now().toString(),
                    name: newUserName,
                    goalKcal: 2200,
                    targetP: 150,
                    targetC: 220,
                    targetF: 60,
                    age: 26, weight: 70, height: 170, gender: 'male', activity: 'moderate', goal: 'maintain'
                };
                setUsers([...users, newUser]);
                setActiveUserId(newUser.id);
                setNewUserName('');
                setShowUserManager(false);
            };

            const handleDeleteUser = (id) => {
                if (users.length <= 1) return;
                const filtered = users.filter(u => u.id !== id);
                setUsers(filtered);
                setActiveUserId(filtered[0].id);
            };

            return (
                <div className="max-w-md mx-auto h-full flex flex-col bg-slate-950 shadow-2xl relative overflow-hidden border-x border-slate-900">
                    
                    {/* CABECERA */}
                    <header className="px-4 py-3 bg-slate-900/80 ios-blur border-b border-slate-800/80 flex items-center justify-between shrink-0 z-20">
                        <div className="flex items-center space-x-2">
                            <div className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                                <i className="fa-solid fa-camera-rotate text-slate-950 font-black text-sm"></i>
                            </div>
                            <div>
                                <h1 className="font-black text-base text-white tracking-tight flex items-center gap-1.5">
                                    NutriScan <span className="text-[10px] bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded-full border border-emerald-500/20 font-bold">AI</span>
                                </h1>
                            </div>
                        </div>

                        {/* SELECTOR DE USUARIO */}
                        <div className="relative">
                            <button 
                                onClick={() => setShowUserManager(!showUserManager)}
                                className="bg-slate-800 border border-slate-700/60 rounded-full px-3 py-1.5 flex items-center space-x-2 text-xs font-bold text-white shadow-sm active-scale"
                            >
                                <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                                <span>{activeUser.name}</span>
                                <i className="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                            </button>

                            {showUserManager && (
                                <div className="absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-2 z-50 space-y-2">
                                    <p className="text-[10px] font-bold text-slate-400 px-2 uppercase">Cambiar Perfil</p>
                                    {users.map(u => (
                                        <div key={u.id} className="flex items-center justify-between p-2 rounded-xl hover:bg-slate-800 transition">
                                            <button onClick={() => { setActiveUserId(u.id); setShowUserManager(false); }} className="flex-1 text-left text-xs font-bold text-white flex items-center space-x-2">
                                                <span className={`w-2 h-2 rounded-full ${u.id === activeUser.id ? 'bg-emerald-400' : 'bg-slate-600'}`}></span>
                                                <span>{u.name}</span>
                                            </button>
                                            {users.length > 1 && (
                                                <button onClick={() => handleDeleteUser(u.id)} className="text-slate-500 hover:text-rose-400 p-1">
                                                    <i className="fa-solid fa-trash text-xs"></i>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                    <div className="border-t border-slate-800 pt-2 px-1 flex gap-1">
                                        <input 
                                            type="text" 
                                            placeholder="Nuevo usuario..." 
                                            value={newUserName}
                                            onChange={(e) => setNewUserName(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white outline-none"
                                        />
                                        <button onClick={handleAddUser} className="bg-emerald-500 text-slate-950 px-2.5 py-1 rounded-lg text-xs font-bold">
                                            <i className="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* CONTENIDO PRINCIPAL SCROLLABLE */}
                    <main className="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
                        
                        {/* 1. VISTA DIARIO */}
                        {activeTab === 'diario' && (
                            <div className="space-y-4 animate-fadeIn">
                                {/* TARJETA CALORÍAS */}
                                <div className="bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-xl relative overflow-hidden">
                                    <div className="flex justify-between items-start mb-3">
                                        <div>
                                            <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Consumo Diario</span>
                                            <div className="flex items-baseline space-x-2 mt-1">
                                                <span className="text-3xl font-black text-white">{totalKcal}</span>
                                                <span className="text-xs font-bold text-slate-400">/ {activeUser.goalKcal} kcal</span>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-[10px] font-extrabold text-emerald-400 uppercase tracking-wider">Restantes</span>
                                            <p className="text-2xl font-black text-emerald-400">{Math.max(0, activeUser.goalKcal - totalKcal)}</p>
                                        </div>
                                    </div>

                                    {/* BARRA PROGRESO */}
                                    <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden p-0.5 mb-4">
                                        <div 
                                            className="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-500"
                                            style={{ width: `${Math.min(100, (totalKcal / activeUser.goalKcal) * 100)}%` }}
                                        ></div>
                                    </div>

                                    {/* MACROS */}
                                    <div className="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800/80 text-center">
                                        <div className="bg-slate-950/40 p-2 rounded-2xl border border-slate-800/50">
                                            <span className="text-[9px] font-black text-amber-400 uppercase">Proteínas</span>
                                            <p className="text-xs font-bold text-white mt-0.5">{totalP} <span className="text-[10px] font-normal text-slate-400">/ {activeUser.targetP}g</span></p>
                                        </div>
                                        <div className="bg-slate-950/40 p-2 rounded-2xl border border-slate-800/50">
                                            <span className="text-[9px] font-black text-blue-400 uppercase">Carbos</span>
                                            <p className="text-xs font-bold text-white mt-0.5">{totalC} <span className="text-[10px] font-normal text-slate-400">/ {activeUser.targetC}g</span></p>
                                        </div>
                                        <div className="bg-slate-950/40 p-2 rounded-2xl border border-slate-800/50">
                                            <span className="text-[9px] font-black text-rose-400 uppercase">Grasas</span>
                                            <p className="text-xs font-bold text-white mt-0.5">{totalF} <span className="text-[10px] font-normal text-slate-400">/ {activeUser.targetF}g</span></p>
                                        </div>
                                    </div>
                                </div>

                                {/* MÓDULO DE AGUA */}
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 text-lg">
                                            <i className="fa-solid fa-droplet"></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-xs text-white">Registro de Agua</h4>
                                            <p className="text-[11px] text-blue-400 font-bold">{waterDrank} ml <span className="text-slate-500 font-normal">/ 2500 ml</span></p>
                                        </div>
                                    </div>
                                    <div className="flex items-center space-x-1.5">
                                        <button onClick={() => setWaterDrank(Math.max(0, waterDrank - 250))} className="w-8 h-8 rounded-xl bg-slate-800 text-slate-300 font-bold active-scale flex items-center justify-center text-xs">
                                            <i className="fa-solid fa-minus"></i>
                                        </button>
                                        <button onClick={() => setWaterDrank(waterDrank + 250)} className="w-8 h-8 rounded-xl bg-blue-500 text-slate-950 font-bold active-scale flex items-center justify-center text-xs">
                                            <i className="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>

                                {/* LISTA DE COMIDAS */}
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center px-1">
                                        <h3 className="font-bold text-sm text-white">Comidas Registradas ({userMeals.length})</h3>
                                        <button onClick={() => setActiveTab('escaner')} className="text-xs font-bold text-emerald-400 flex items-center space-x-1">

                        <button onClick={() => setActiveTab('tmb')} className={`flex flex-col items-center space-y-1 ${activeTab === 'tmb' ? 'text-emerald-400' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-calculator text-base"></i>
                            <span className="text-[10px] font-bold">TMB</span>
                        </button>
                        <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center space-y-1 ${activeTab === 'stats' ? 'text-emerald-400' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-chart-line text-base"></i>
                            <span className="text-[10px] font-bold">Stats</span>
                        </button>
                    </nav>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
