<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NutriScan AI - Contador de Calorías iOS</title>

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutriScan">
    <meta name="theme-color" content="#020617">

    <!-- PWA Manifest Data URI -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"NutriScan AI","short_name":"NutriScan","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#020617","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2921/2921822.png","sizes":"512x512","type":"image/png"}]}'>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Production) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ios: {
                            bg: '#000000',
                            card: '#1c1c1e',
                            cardSecondary: '#2c2c2e',
                            accent: '#10b981',
                            blue: '#0a84ff',
                            rose: '#ff453a',
                            amber: '#ffd60a',
                            sky: '#64d2ff'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .mb-safe { margin-bottom: env(safe-area-inset-bottom); }

        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        ::-webkit-scrollbar { display: none; }
        * { -webkit-tap-highlight-color: transparent; }

        .active-scale {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .active-scale:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="h-full bg-black text-slate-100 overflow-hidden font-sans antialiased">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // BASE DE DATOS AMPLIADA DE ALIMENTOS E INGREDIENTES
        const INGREDIENT_DICT = [
            // PANES Y SOPORTES
            { keywords: ['bocadillo', 'pan', 'bocata', 'tostada', 'mollete', 'sandwich', 'sándwich'], name: 'Pan / Base de Pan', calories: 180, p: 6, c: 36, f: 1.5 },
            
            // VERDURAS Y HORTALIZAS
            { keywords: ['zanahoria', 'zanahorias'], name: 'Zanahoria', calories: 41, p: 0.9, c: 9.6, f: 0.2 },
            { keywords: ['calabacin', 'calabacín'], name: 'Calabacín', calories: 17, p: 1.2, c: 3.1, f: 0.3 },
            { keywords: ['brocoli', 'brócoli'], name: 'Brócoli', calories: 34, p: 2.8, c: 6.6, f: 0.4 },
            { keywords: ['champinon', 'champiñón', 'champinones', 'champiñones', 'setas'], name: 'Champiñones / Setas', calories: 22, p: 3.1, c: 3.3, f: 0.3 },
            { keywords: ['pimiento', 'pimientos'], name: 'Pimiento', calories: 20, p: 0.9, c: 4.6, f: 0.2 },
            { keywords: ['pepino', 'pepinos'], name: 'Pepino', calories: 15, p: 0.7, c: 3.6, f: 0.1 },
            { keywords: ['espinaca', 'espinacas'], name: 'Espinacas', calories: 23, p: 2.9, c: 3.6, f: 0.4 },
            { keywords: ['calabaza'], name: 'Calabaza', calories: 26, p: 1, c: 6.5, f: 0.1 },

            // INGREDIENTES VARIADOS
            { keywords: ['jamon', 'jamón'], name: 'Jamón Serrano / Ibérico', calories: 140, p: 18, c: 0.5, f: 7.5 },
            { keywords: ['aguacate'], name: 'Aguacate', calories: 120, p: 1.5, c: 6, f: 11 },
            { keywords: ['ajo', 'ajos'], name: 'Ajo', calories: 10, p: 0.4, c: 2.2, f: 0 },
            { keywords: ['chili', 'chile', 'guindilla', 'picante'], name: 'Chili / Guindilla', calories: 15, p: 0.5, c: 3, f: 0.2 },
            
            // PESCADOS Y CARNES
            { keywords: ['lubina'], name: 'Lubina', calories: 230, p: 32, c: 0, f: 10, img: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=600&auto=format&fit=crop&q=80' },
            { keywords: ['emperador', 'pez espada'], name: 'Emperador', calories: 260, p: 35, c: 0, f: 12, img: 'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=600&auto=format&fit=crop&q=80' },
            { keywords: ['pollo', 'pechuga'], name: 'Pechuga de Pollo', calories: 220, p: 38, c: 0, f: 6 },
            { keywords: ['pavo'], name: 'Pavo', calories: 130, p: 24, c: 1, f: 3 },
            { keywords: ['ternera', 'carne'], name: 'Carne de Ternera', calories: 250, p: 26, c: 0, f: 15 },
            
            // GUARNICIONES Y LÁCTEOS
            { keywords: ['patata', 'patatas'], name: 'Patatas', calories: 180, p: 4, c: 40, f: 1 },
            { keywords: ['beicon', 'bacon'], name: 'Beicon', calories: 150, p: 6, c: 0, f: 14 },
            { keywords: ['queso'], name: 'Queso', calories: 120, p: 7, c: 1, f: 10 },
            { keywords: ['mantequilla'], name: 'Mantequilla', calories: 100, p: 0.1, c: 0, f: 11 },
            { keywords: ['aceite'], name: 'Aceite de Oliva', calories: 90, p: 0, c: 0, f: 10 },
            { keywords: ['tomate', 'tomates'], name: 'Tomate', calories: 25, p: 1, c: 5, f: 0.2 },
            { keywords: ['cebolla'], name: 'Cebolla', calories: 30, p: 1, c: 7, f: 0.1 },
            { keywords: ['huevo', 'huevos'], name: 'Huevo', calories: 140, p: 12, c: 1, f: 10 },
            
            // OTROS POPULARES
            { keywords: ['arroz'], name: 'Arroz', calories: 200, p: 4, c: 44, f: 1 },
            { keywords: ['leche'], name: 'Leche', calories: 90, p: 5, c: 8, f: 4 },
            { keywords: ['canela'], name: 'Canela', calories: 5, p: 0, c: 1, f: 0 },
            { keywords: ['manzana'], name: 'Manzana', calories: 82, p: 0.5, c: 21, f: 0.3, img: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=600&auto=format&fit=crop&q=80' },
            { keywords: ['ensalada'], name: 'Ensalada', calories: 90, p: 3, c: 8, f: 5, img: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600&auto=format&fit=crop&q=80' },
            { keywords: ['hamburguesa', 'burger'], name: 'Hamburguesa', calories: 520, p: 30, c: 35, f: 28, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop&q=80' }
        ];

        const STORAGE_KEY_MEALS = 'nutriscan_ios_meals';

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');

            // MULTI-USER STATE
            const [profiles, setProfiles] = useState(() => {
                const saved = localStorage.getItem('nutriscan_ios_profiles');
                return saved ? JSON.parse(saved) : [
                    {
                        id: 'u1', name: "Ruben", gender: "male", age: 30, weight: 75, height: 178,
                        activity: 1.55, goal: 0, bmr: 1710, tdee: 2650, targetCalories: 2561,
                        targetProtein: 192, targetCarbs: 288, targetFats: 71
                    },
                    {
                        id: 'u2', name: "Marta", gender: "female", age: 26, weight: 58, height: 165,
                        activity: 1.375, goal: 0, bmr: 1350, tdee: 1850, targetCalories: 1850,
                        targetProtein: 110, targetCarbs: 190, targetFats: 60
                    }
                ];
            });

            const [currentUserId, setCurrentUserId] = useState(() => {
                return localStorage.getItem('nutriscan_ios_active_user_id') || 'u1';
            });

            const [showAddProfileModal, setShowAddProfileModal] = useState(false);
            const [newProfileName, setNewProfileName] = useState('');

            const activeUser = profiles.find(p => p.id === currentUserId) || profiles[0];

            const [meals, setMeals] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY_MEALS);
                return saved ? JSON.parse(saved) : [];
            });

            // SCAN / MANUAL ENTRY MODES
            const [entryMode, setEntryMode] = useState('scan'); 
            
            // MANUAL FORM STATE
            const [manualDishName, setManualDishName] = useState('');
            const [manualMealType, setManualMealType] = useState('Almuerzo');
            const [manualCalories, setManualCalories] = useState(0);
            const [manualProtein, setManualProtein] = useState(0);
            const [manualCarbs, setManualCarbs] = useState(0);
            const [manualFats, setManualFats] = useState(0);
            const [manualIngredients, setManualIngredients] = useState([]);

            // CAMERA / SCAN STATE
            const [previewImage, setPreviewImage] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [analyzedResult, setAnalyzedResult] = useState(null);
            const [selectedMealType, setSelectedMealType] = useState('Almuerzo');

            useEffect(() => {
                localStorage.setItem('nutriscan_ios_profiles', JSON.stringify(profiles));
            }, [profiles]);

            useEffect(() => {
                localStorage.setItem('nutriscan_ios_active_user_id', currentUserId);
            }, [currentUserId]);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY_MEALS, JSON.stringify(meals));
            }, [meals]);

            // MOTOR DE CÁLCULO SUMATORIO DINÁMICO POR INGREDIENTE
            const handleManualNameChange = (name) => {
                setManualDishName(name);
                const query = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                
                if (!query) {
                    setManualCalories(0);
                    setManualProtein(0);
                    setManualCarbs(0);
                    setManualFats(0);
                    setManualIngredients([]);
                    return;
                }

                let totalCals = 0;
                let totalP = 0;
                let totalC = 0;
                let totalF = 0;
                let detectedIngs = [];

                INGREDIENT_DICT.forEach(item => {
                    const match = item.keywords.some(kw => {
                        const cleanKw = kw.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                        return query.includes(cleanKw);
                    });

                    if (match) {
                        totalCals += item.calories;
                        totalP += item.p;
                        totalC += item.c;
                        totalF += item.f;
                        detectedIngs.push({
                            name: item.name,
                            calories: item.calories,
                            protein: item.p,
                            carbs: item.c,
                            fats: item.f
                        });
                    }
                });

                if (detectedIngs.length > 0) {
                    setManualCalories(totalCals);
                    setManualProtein(Math.round(totalP * 10) / 10);
                    setManualCarbs(Math.round(totalC * 10) / 10);
                    setManualFats(Math.round(totalF * 10) / 10);
                    setManualIngredients(detectedIngs);
                } else {
                    const estimatedCals = Math.max(50, query.split(" ").length * 40);
                    setManualCalories(estimatedCals);
                    setManualProtein(3);
                    setManualCarbs(8);
                    setManualFats(2);
                    setManualIngredients([{ name: name, calories: estimatedCals, protein: 3, carbs: 8, fats: 2 }]);
                }
            };

            const handleImageSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setPreviewImage(reader.result);
                        processImageAnalysis(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const processImageAnalysis = (imgSrc) => {
                setIsAnalyzing(true);
                setTimeout(() => {
                    setIsAnalyzing(false);
                    setAnalyzedResult({
                        name: 'Emperador a la Plancha con Guarnición',
                        calories: 380,
                        protein: 42,
                        carbs: 12,
                        fats: 16,
                        img: imgSrc
                    });
                }, 1200);
            };

            const handleSaveScanMeal = () => {
                if (!analyzedResult) return;
                const newMeal = {
                    id: Date.now().toString(),
                    userId: currentUserId,
                    name: analyzedResult.name,
                    type: selectedMealType,
                    calories: analyzedResult.calories,
                    protein: analyzedResult.protein,
                    carbs: analyzedResult.carbs,
                    fats: analyzedResult.fats,
                    img: analyzedResult.img || 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=600&auto=format&fit=crop&q=80',
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    date: new Date().toISOString().split('T')[0]
                };
                setMeals([newMeal, ...meals]);
                setPreviewImage(null);
                setAnalyzedResult(null);
                setActiveTab('dashboard');
            };

            const handleSaveManualMeal = () => {
                if (!manualDishName.trim()) return;
                const newMeal = {
                    id: Date.now().toString(),
                    userId: currentUserId,
                    name: manualDishName,
                    type: manualMealType,
                    calories: Number(manualCalories) || 0,
                    protein: Number(manualProtein) || 0,
                    carbs: Number(manualCarbs) || 0,
                    fats: Number(manualFats) || 0,
                    ingredients: manualIngredients,
                    img: 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=600&auto=format&fit=crop&q=80',
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    date: new Date().toISOString().split('T')[0]
                };
                setMeals([newMeal, ...meals]);
                setManualDishName('');
                setManualCalories(0);
                setManualProtein(0);
                setManualCarbs(0);
                setManualFats(0);
                setManualIngredients([]);
                setActiveTab('dashboard');
            };

            const handleDeleteMeal = (id) => {
                setMeals(meals.filter(m => m.id !== id));
            };

            const handleAddUser = () => {
                if (!newProfileName.trim()) return;
                const newId = 'u_' + Date.now();
                const newProfile = {
                    id: newId,
                    name: newProfileName,
                    gender: "male", age: 30, weight: 70, height: 175,
                    activity: 1.375, goal: 0, bmr: 1600, tdee: 2200, targetCalories: 2200,
                    targetProtein: 140, targetCarbs: 220, targetFats: 60
                };
                setProfiles([...profiles, newProfile]);
                setCurrentUserId(newId);
                setNewProfileName('');
                setShowAddProfileModal(false);
            };

            // USER TODAY MEALS
            const todayStr = new Date().toISOString().split('T')[0];
            const userMealsToday = meals.filter(m => m.userId === currentUserId && m.date === todayStr);

            const totalCaloriesToday = userMealsToday.reduce((sum, m) => sum + (Number(m.calories) || 0), 0);
            const totalProteinToday = userMealsToday.reduce((sum, m) => sum + (Number(m.protein) || 0), 0);
            const totalCarbsToday = userMealsToday.reduce((sum, m) => sum + (Number(m.carbs) || 0), 0);
            const totalFatsToday = userMealsToday.reduce((sum, m) => sum + (Number(m.fats) || 0), 0);

            const remainingCals = activeUser.targetCalories - totalCaloriesToday;

            return (
                <div className="flex flex-col h-full bg-black text-white relative">
                    
                    {/* TOP HEADER / USER SWITCHER */}
                    <header className="pt-safe px-5 pb-3 flex items-center justify-between border-b border-slate-800 bg-slate-900/80 ios-blur sticky top-0 z-20">
                        <div className="flex items-center space-x-2">
                            <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">
                                <i className="fa-solid fa-camera-retro text-sm"></i>
                            </div>
                            <span className="font-bold tracking-tight text-lg">NutriScan <span className="text-emerald-400 text-xs bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">AI</span></span>
                        </div>

                        {/* PROFILE DROPDOWN */}
                        <div className="relative">
                            <select 
                                value={currentUserId} 
                                onChange={(e) => {
                                    if(e.target.value === 'NEW') {
                                        setShowAddProfileModal(true);
                                    } else {
                                        setCurrentUserId(e.target.value);
                                    }
                                }}
                                className="bg-slate-800 text-emerald-400 font-semibold text-sm px-3 py-1.5 rounded-full border border-slate-700 outline-none appearance-none pr-7 cursor-pointer"
                            >
                                {profiles.map(p => (
                                    <option key={p.id} value={p.id} className="bg-slate-900 text-white">👤 {p.name}</option>
                                ))}
                                <option value="NEW" className="bg-slate-900 text-emerald-400">+ Añadir Usuario</option>
                            </select>
                            <i className="fa-solid fa-chevron-down text-xs text-emerald-400 absolute right-2.5 top-3 pointer-events-none"></i>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 overflow-y-auto px-4 py-4 space-y-4 pb-24">
                        
                        {/* DASHBOARD TAB */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-baseline px-1">
                                    <h1 className="text-2xl font-black">Hola, {activeUser.name}</h1>
                                    <span className="text-xs text-slate-400">{new Date().toLocaleDateString('es-ES', { weekday: 'short', month: 'short', day: 'numeric' })}</span>
                                </div>

                                {/* SUMMARY CARD */}
                                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <p className="text-xs text-slate-400 uppercase tracking-wider font-semibold">CONSUMO HOY</p>
                                            <p className="text-3xl font-black text-white">{totalCaloriesToday} <span className="text-sm font-normal text-slate-400">/ {activeUser.targetCalories} kcal</span></p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-xs text-slate-400 uppercase tracking-wider font-semibold">RESTANTES</p>
                                            <p className={`text-2xl font-bold ${remainingCals < 0 ? 'text-rose-500' : 'text-emerald-400'}`}>{remainingCals}</p>
                                        </div>
                                    </div>

                                    {/* PROGRESS BAR */}
                                    <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                                        <div 
                                            className="bg-emerald-500 h-full transition-all duration-500 rounded-full" 
                                            style={{ width: `${Math.min(100, (totalCaloriesToday / activeUser.targetCalories) * 100)}%` }}
                                        ></div>
                                    </div>

                                    {/* MACROS */}
                                    <div className="grid grid-cols-3 gap-2 pt-2">
                                        <div className="bg-slate-800/50 p-2.5 rounded-2xl border border-slate-700/50 text-center">
                                            <p className="text-[10px] text-amber-400 font-bold uppercase">PROT</p>
                                            <p className="text-sm font-bold">{Math.round(totalProteinToday)}g <span className="text-[10px] text-slate-400">/ {activeUser.targetProtein}g</span></p>
                                        </div>
                                        <div className="bg-slate-800/50 p-2.5 rounded-2xl border border-slate-700/50 text-center">
                                            <p className="text-[10px] text-sky-400 font-bold uppercase">CARB</p>
                                            <p className="text-sm font-bold">{Math.round(totalCarbsToday)}g <span className="text-[10px] text-slate-400">/ {activeUser.targetCarbs}g</span></p>
                                        </div>
                                        <div className="bg-slate-800/50 p-2.5 rounded-2xl border border-slate-700/50 text-center">
                                            <p className="text-[10px] text-rose-400 font-bold uppercase">GRASA</p>
                                            <p className="text-sm font-bold">{Math.round(totalFatsToday)}g <span className="text-[10px] text-slate-400">/ {activeUser.targetFats}g</span></p>
                                        </div>
                                    </div>
                                </div>

                                {/* MEAL LIST */}
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center px-1">
                                        <h3 className="font-bold text-lg">Comidas de Hoy ({userMealsToday.length})</h3>
                                        <button onClick={() => setActiveTab('scan')} className="text-xs font-semibold text-emerald-400 hover:text-emerald-300">
                                            + Añadir
                                        </button>
                                    </div>

                                    {userMealsToday.length === 0 ? (
                                        <div className="bg-slate-900/40 border border-dashed border-slate-800 rounded-3xl p-8 text-center text-slate-500">
                                            <i className="fa-solid fa-utensils text-2xl mb-2"></i>
                                            <p className="text-sm">No has registrado ninguna comida hoy.</p>
                                        </div>
                                    ) : (
                                        userMealsToday.map(meal => (
                                            <div key={meal.id} className="bg-slate-900 border border-slate-800/80 rounded-2xl p-3 flex items-center justify-between">
                                                <div className="flex items-center space-x-3">
                                                    <img src={meal.img} className="w-12 h-12 rounded-xl object-cover bg-slate-800" />
                                                    <div>
                                                        <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-slate-800 text-emerald-400">{meal.type}</span>
                                                        <p className="font-bold text-sm mt-0.5">{meal.name}</p>
                                                        <p className="text-[11px] text-slate-400">{meal.timestamp} • {meal.protein}g P | {meal.carbs}g C | {meal.fats}g G</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center space-x-3">
                                                    <span className="font-black text-sm">{meal.calories} <span className="text-[10px] font-normal text-slate-400">kcal</span></span>
                                                    <button onClick={() => handleDeleteMeal(meal.id)} className="text-slate-600 hover:text-rose-500 p-1">
                                                        <i className="fa-solid fa-times"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* SCAN / ADD MEAL TAB */}
                        {activeTab === 'scan' && (
                            <div className="space-y-4">
                                {/* MODE SWITCHER */}
                                <div className="flex bg-slate-900 p-1 rounded-2xl border border-slate-800">
                                    <button 
                                        onClick={() => setEntryMode('scan')}
                                        className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${entryMode === 'scan' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400'}`}
                                    >
                                        <i className="fa-solid fa-camera mr-1.5"></i> 📷 Foto AI
                                    </button>
                                    <button 
                                        onClick={() => setEntryMode('manual')}
                                        className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${entryMode === 'manual' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400'}`}
                                    >
                                        <i className="fa-solid fa-pen mr-1.5"></i> ✍️ Manual
                                    </button>
                                </div>

                                {entryMode === 'scan' ? (
                                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 text-center">
                                        {!previewImage ? (
                                            <div className="py-8 space-y-4">
                                                <div className="w-20 h-20 mx-auto rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-3xl">
                                                    <i className="fa-solid fa-camera"></i>
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-lg">Escanear Plato con Foto</h3>
                                                    <p className="text-xs text-slate-400 mt-1">Sube o toma una foto para detectar calorías dinámicamente</p>
                                                </div>
                                                <label className="inline-block bg-emerald-500 text-slate-950 font-bold px-6 py-3 rounded-2xl active-scale cursor-pointer">
                                                    Tomar / Seleccionar Foto
                                                    <input type="file" accept="image/*" capture="environment" onChange={handleImageSelect} className="hidden" />
                                                </label>
                                            </div>
                                        ) : (
                                            <div className="space-y-4 text-left">
                                                <div className="relative rounded-2xl overflow-hidden max-h-56 bg-slate-800">
                                                    <img src={previewImage} className="w-full h-full object-cover" />
                                                    {isAnalyzing && (
                                                        <div className="absolute inset-0 bg-black/60 ios-blur flex flex-col items-center justify-center space-y-2">
                                                            <i className="fa-solid fa-spinner fa-spin text-2xl text-emerald-400"></i>
                                                            <p className="text-xs font-bold text-emerald-400">Analizando plato con IA...</p>
                                                        </div>
                                                    )}
                                                </div>

                                                {analyzedResult && !isAnalyzing && (
                                                    <div className="space-y-3">
                                                        <input 
                                                            type="text" 
                                                            value={analyzedResult.name}
                                                            onChange={(e) => setAnalyzedResult({ ...analyzedResult, name: e.target.value })}
                                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 font-bold text-sm outline-none"
                                                        />
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <div className="bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                                                                <span className="text-[10px] text-slate-400">Calorías Totales</span>
                                                                <input 
                                                                    type="number" 
                                                                    value={analyzedResult.calories}
                                                                    onChange={(e) => setAnalyzedResult({ ...analyzedResult, calories: Number(e.target.value) })}
                                                                    className="w-full bg-transparent font-black text-lg text-emerald-400 outline-none"
                                                                />
                                                            </div>
                                                            <div className="bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                                                                <span className="text-[10px] text-slate-400">Tipo de Comida</span>
                                                                <select 
                                                                    value={selectedMealType} 
                                                                    onChange={(e) => setSelectedMealType(e.target.value)}
                                                                    className="w-full bg-transparent font-bold text-sm outline-none text-white mt-1"
                                                                >
                                                                    <option value="Desayuno" className="bg-slate-900">Desayuno</option>
                                                                    <option value="Almuerzo" className="bg-slate-900">Almuerzo</option>
                                                                    <option value="Cena" className="bg-slate-900">Cena</option>
                                                                    <option value="Snack" className="bg-slate-900">Snack</option>
                                                                </select>
                                                            </div>
                                                        </div>

                                                        <button 
                                                            onClick={handleSaveScanMeal}
                                                            className="w-full py-3 bg-emerald-500 text-slate-950 font-bold rounded-2xl active-scale"
                                                        >
                                                            Guardar en Registro
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    /* MANUAL ENTRY FORM */
                                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
                                        <div>
                                            <label className="text-xs font-bold text-slate-400 uppercase">Nombre del Plato / Ingredientes</label>
                                            <input 
                                                type="text" 
                                                placeholder="Ej: Lubina con patatas y beicon" 
                                                value={manualDishName}
                                                onChange={(e) => handleManualNameChange(e.target.value)}
                                                className="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 mt-1 font-bold text-white outline-none focus:border-emerald-500"
                                            />
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase">Tipo</label>
                                                <select 
                                                    value={manualMealType}
                                                    onChange={(e) => setManualMealType(e.target.value)}
                                                    className="w-full bg-slate-800 border border-slate-700 rounded-2xl px-3 py-3 mt-1 font-semibold text-white outline-none"
                                                >
                                                    <option value="Desayuno">Desayuno</option>
                                                    <option value="Almuerzo">Almuerzo</option>
                                                    <option value="Cena">Cena</option>
                                                    <option value="Snack">Snack</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase">Calorías Totales</label>
                                                <input 
                                                    type="number" 
                                                    value={manualCalories}
                                                    onChange={(e) => setManualCalories(Number(e.target.value))}
                                                    className="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 mt-1 font-black text-emerald-400 outline-none"
                                                />
                                            </div>
                                        </div>

                                        {/* INGREDIENT BREAKDOWN PREVIEW */}
                                        {manualIngredients.length > 0 && (
                                            <div className="bg-slate-800/50 rounded-2xl p-3 border border-slate-700/50 space-y-2">
                                                <p className="text-[10px] font-bold text-slate-400 uppercase">Ingredientes Detectados Dinámicamente:</p>
                                                <div className="space-y-1">
                                                    {manualIngredients.map((ing, idx) => (
                                                        <div key={idx} className="flex justify-between items-center text-xs">
                                                            <span className="text-slate-300">• {ing.name}</span>
                                                            <span className="font-bold text-emerald-400">+{ing.calories} kcal</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        <button 
                                            onClick={handleSaveManualMeal}
                                            className="w-full py-3 bg-emerald-500 text-slate-950 font-bold rounded-2xl active-scale mt-2"
                                        >
                                            Registrar Comida
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>

                    {/* BOTTOM NAVIGATION BAR */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/90 ios-blur border-t border-slate-800 px-6 py-2 flex justify-around items-center pb-safe z-30">
                        <button 
                            onClick={() => setActiveTab('dashboard')} 
                            className={`flex flex-col items-center space-y-1 ${activeTab === 'dashboard' ? 'text-emerald-400' : 'text-slate-500'}`}
                        >
                            <i className="fa-solid fa-chart-pie text-lg"></i>
                            <span className="text-[10px] font-bold">Diario</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('scan')} 
                            className={`flex flex-col items-center space-y-1 ${activeTab === 'scan' ? 'text-emerald-400' : 'text-slate-500'}`}
                        >
                            <i className="fa-solid fa-circle-plus text-2xl text-emerald-400"></i>
                            <span className="text-[10px] font-bold">Añadir</span>
                        </button>
                    </nav>

                    {/* ADD PROFILE MODAL */}
                    {showAddProfileModal && (
                        <div className="fixed inset-0 bg-black/70 ios-blur z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4">
                                <h3 className="font-bold text-lg">Nuevo Perfil de Usuario</h3>
                                <input 
                                    type="text" 
                                    placeholder="Nombre (ej: Marta, Alex)" 
                                    value={newProfileName}
                                    onChange={(e) => setNewProfileName(e.target.value)}
                                    className="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 font-bold text-white outline-none"
                                />
                                <div className="flex space-x-2">
                                    <button 
                                        onClick={() => setShowAddProfileModal(false)}
                                        className="flex-1 py-2.5 bg-slate-800 font-bold text-xs rounded-xl text-slate-400"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        onClick={handleAddUser}
                                        className="flex-1 py-2.5 bg-emerald-500 text-slate-950 font-bold text-xs rounded-xl"
                                    >
                                        Crear Perfil
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
